<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content-Security-Policy:
    - default-src 'self'           → only same-origin resources
    - script-src 'self'            → no inline scripts or eval
    - style-src 'self' 'unsafe-inline' → Tailwind needs inline styles via the style attr
    - img-src 'self' data:         → data: URIs for SVG icons
    - connect-src 'self' localhost → fetch to the local data service (backend on another port)
    - object-src 'none'            → block Flash/PDF plugins
    - base-uri 'self'              → guard against <base> hijacking
    - form-action 'self'           → forms cannot submit to third-party sites
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <title>Tick — personal time tracker</title>
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="description" content="A minimal time tracker with projects, tags, reports and a calendar. No account — your data stays in your browser." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tick" />
  <meta property="og:title" content="Tick — personal time tracker" />
  <meta property="og:description" content="A minimal time tracker with projects, tags, reports and a calendar. No account — your data stays in your browser." />
  <meta property="og:url" content="https://yuragets.github.io/tick/" />
  <meta property="og:image" content="https://yuragets.github.io/tick/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Tick time tracker showing tracked time per day, split by project" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tick — personal time tracker" />
  <meta name="twitter:description" content="A minimal time tracker with projects, tags, reports and a calendar. No account — your data stays in your browser." />
  <meta name="twitter:image" content="https://yuragets.github.io/tick/og-image.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
